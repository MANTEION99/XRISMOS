<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Μέτρηση | Μαντείο</title>
<style>
  body{ margin:0; background:#0B0A16; color:#F5F1E8; font:15px/1.5 Inter,Arial,sans-serif; padding:18px 14px 40px; }
  h1{ font-family:Georgia,serif; color:#D9B25C; font-size:24px; margin:0 0 12px; }
  .box{ max-width:560px; margin:0 auto; }
  input,select,button{ font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid #D9B25C; background:#14122a; color:#F5F1E8; }
  button{ background:#D9B25C; color:#241A08; font-weight:700; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .card{ border:1px solid rgba(217,178,92,.4); border-radius:14px; padding:14px; margin-bottom:12px; background:rgba(217,178,92,.04); }
  .card h2{ font-size:16px; color:#D9B25C; margin:0 0 8px; }
  .big{ font-size:30px; font-weight:700; }
  table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  td{ padding:5px 2px; border-bottom:1px solid rgba(255,255,255,.07); }
  td.n{ text-align:right; font-weight:700; color:#D9B25C; }
  .muted{ color:#9C96AE; font-size:13px; }
  #err{ color:#e07a8c; }
</style>
</head>
<body>
<div class="box">
  <h1>Μέτρηση του Μαντείου</h1>
  <div class="row">
    <input id="k" type="password" placeholder="Κωδικός" style="flex:1">
    <select id="r"><option value="1">Σήμερα</option><option value="2">Χθες</option><option value="7" selected>7 μέρες</option><option value="30">30 μέρες</option><option value="90">90 μέρες</option></select>
    <button id="go">Δείξε</button>
  </div>
  <div id="err"></div>
  <div id="out"></div>
  <div id="rev"></div>
  <p class="muted">Μετράει όλες τις επισκέψεις χωρίς cookies και χωρίς προσωπικά στοιχεία. Οι μέρες είναι με ώρα Ελλάδας.</p>
</div>
<script>
const SRC = { tiktok:"TikTok", instagram:"Instagram", facebook:"Facebook", messenger:"Messenger", google:"Google", youtube:"YouTube", esoteriki:"Από άλλη σελίδα του manteio.live", agnosti:"Χωρίς πηγή (συνήθως από εφαρμογή)", alli:"Άλλη" };
const PAGE = { "/":"Αρχική", "/index":"Αρχική", "/oroskopos":"Ωροσκόπος", "/synomilia":"Συνομιλία", "/epistrofi":"Θα επιστρέψει;", "/agapi":"Με σκέφτεται ακόμα;", "/alitheia":"Μου κρύβει κάτι;", "/oikonomika":"Οικονομικά", "/symvatotita":"Ταιριάζουμε;", "/erotima":"Η δική μου ερώτηση", "/arxiki":"Αρχική", "/oles":"Όλες οι προβλέψεις", "/iris":"IRIS", "/karta":"Κάρτα, Apple Pay ή Google Pay", "/fail":"IRIS (απέτυχε)", "/back":"Κάρτα (γύρισαν πίσω)", "/arithmologia":"Αριθμολογία", "/numerology":"Αριθμολογία", "/taro":"Ταρώ", "/xartis":"Γενέθλιος Χάρτης", "/paidi":"Χάρτης του παιδιού", "/eggoni":"Χάρτης του παιδιού", "/2027":"Ημερολόγιο 2027", "/imerologio":"Ημερολόγιο 2027", "/tyxeres-meres":"Τυχερές μέρες εβδομάδας" };
const EV = { oroskopos:"Υπολόγισαν Ωροσκόπο", dorean:"Δωρεάν απάντηση", "pliromi-koumpi":"Πάτησαν πληρωμή", pliromeni:"Πλήρωσαν και πήραν απάντηση", "oroskopos-mpara":"Ωροσκόπος, πάτησαν πάνω", "oroskopos-plaisio":"Ωροσκόπος, πάτησαν στο πλαίσιο", "oroskopos-apotelesma":"Ωροσκόπος, πάτησαν στο αποτέλεσμα", "arxiki-proti":"Αρχική, πάτησαν την πρώτη ερώτηση", "arxiki-kouti":"Αρχική, πάτησαν πλαίσιο", "epilogi-pliromis":"Διάλεξαν στο παράθυρο πληρωμής", "tropos-pliromis":"Πλήρωσαν με", "pliromi-den-oloklirothike":"Η πληρωμή δεν ολοκληρώθηκε", "pliromi-xanadokimi":"Πάτησαν «Δοκίμασε ξανά»", "pliromi-piso":"Πάτησαν «Πίσω» στο παράθυρο πληρωμής", epilogi:"Διάλεξαν τρόπο πληρωμής", ksanaeidan:"Ξαναείδαν την απάντηση που πλήρωσαν" };
const $ = (id) => document.getElementById(id);
try { $("k").value = localStorage.getItem("metrisi_k") || ""; } catch (e) {}
function add(a, b) { for (const k in b) a[k] = (a[k] || 0) + b[k]; }
function table(obj, names) {
  const rows = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '<p class="muted">Τίποτα ακόμα.</p>';
  return "<table>" + rows.map(([k, v]) => `<tr><td>${names(k)}</td><td class="n">${v}</td></tr>`).join("") + "</table>";
}
function evName(k) { const [a, b] = k.split(":"); return (EV[a] || a) + (b ? " · " + (PAGE["/" + b] || b) : ""); }
// Σκάλα ανά υπηρεσία: σε ποιο σκαλί χάνεται ο κόσμος.
// Η ίδια υπηρεσία μπορεί να εμφανίζεται με δύο ονόματα (π.χ. /arithmologia και numerology), τα ενώνουμε.
const ALIAS = { numerology:"arithmologia", eggoni:"paidi", "2027":"imerologio", tyxeres:"tyxeres-meres", xartis_plus:"xartis" };
const FUNNEL = ["epistrofi","agapi","alitheia","erotima","symvatotita","oikonomika","arithmologia","taro","tyxeres-meres","imerologio","xartis","paidi","synomilia"];
function funnel(V, E) {
  const F = {};
  const put = (slug, step, n) => { slug = ALIAS[slug] || slug; if (!FUNNEL.includes(slug)) return; (F[slug] = F[slug] || { v:0, d:0, k:0, c:0, p:0 })[step] += n; };
  for (const k in V) put(k.replace(/^\//, ""), "v", V[k]);
  for (const k in E) { const [a, b] = k.split(":"); const st = { dorean:"d", "pliromi-koumpi":"k", epilogi:"c", pliromeni:"p" }[a]; if (st && b) put(b, st, E[k]); }
  const rows = FUNNEL.filter(s => F[s] && (F[s].v || F[s].d || F[s].k || F[s].p)).map(s => {
    const f = F[s], step = (lab, n, prev) => `<tr><td>${lab}</td><td class="n">${n}${prev && n <= prev ? ` <span class="muted">(${Math.round(100 * n / prev)}%)</span>` : ""}</td></tr>`;
    return `<p style="margin:14px 0 4px;color:#D9B25C;font-weight:700">${PAGE["/" + s] || s}</p><table>` +
      step("Άνοιξαν τη σελίδα", f.v) + step("Πήραν δωρεάν απάντηση", f.d, f.v) + step("Πάτησαν πληρωμή", f.k, f.d) +
      step("Διάλεξαν τρόπο πληρωμής", f.c, f.k) + step("Πλήρωσαν", f.p, f.c || f.k) + `</table>`;
  }).join("");
  return `<div class="card"><h2>Σκάλα ανά υπηρεσία</h2><p class="muted" style="margin:0">Σε κάθε σκαλί, το ποσοστό δείχνει πόσοι πέρασαν από το προηγούμενο. Το «Διάλεξαν τρόπο πληρωμής» μετράει από 25/11 απόγευμα. Το «Άνοιξαν τη σελίδα» μετράει κάθε άνοιγμα, μαζί και τις ανανεώσεις. Το «Πάτησαν πληρωμή» μετράει και τη 2η και 3η ερώτηση, γι' αυτό μπορεί να είναι περισσότερα από τις δωρεάν απαντήσεις.</p>${rows || '<p class="muted">Τίποτα ακόμα.</p>'}</div>`;
}
async function load() {
  $("err").textContent = ""; $("out").innerHTML = '<p class="muted">Φόρτωση…</p>';
  const k = $("k").value.trim(); const r = +$("r").value;
  try { localStorage.setItem("metrisi_k", k); } catch (e) {}
  const res = await fetch("/api/metrisi?days=" + Math.max(r, 2) + "&k=" + encodeURIComponent(k));
  const d = await res.json();
  if (!res.ok) { $("out").innerHTML = ""; $("err").textContent = d.error || "Σφάλμα"; return; }
  const days = r === 2 ? [d.days[1]] : d.days.slice(0, r);
  const V = {}, S = {}, E = {}, VR = {}, SR = {}, PR = {}, HS = {}, HR = {}; let HP = 0;
  days.forEach(x => { add(V, x.v || {}); add(S, x.s || {}); add(E, x.e || {}); add(VR, x.vr || {}); add(SR, x.sr || {}); add(PR, x.pr || {}); add(HS, x.hs || {}); add(HR, x.hr || {}); HP += x.h || 0; });
  const nr = (o) => (o.n || o.r) ? `<p class="muted" style="margin:6px 0 0">Νέοι <b style="color:#F5F1E8">${o.n || 0}</b> · Ξαναήρθαν <b style="color:#F5F1E8">${o.r || 0}</b></p>` : "";
  const total = Object.values(S).reduce((a, b) => a + b, 0);
  const PT = {}, PM = {}, PQ = {}, REST = {};
  for (const k in E) {
    const [a, b] = k.split(":");
    if (a === "pliromeni") PT[b || "?"] = (PT[b || "?"] || 0) + E[k];
    else if (a === "tropos-pliromis") PM[b || "?"] = (PM[b || "?"] || 0) + E[k];
    else if (a === "erotisi") PQ[b || "?"] = (PQ[b || "?"] || 0) + E[k];
    else REST[k] = E[k];
  }
  const paid = Object.values(PT).reduce((a, b) => a + b, 0);
  const MET = { iris: "IRIS", karta: "Κάρτα, Apple Pay ή Google Pay" };
  let html = `<div class="card" style="border-color:#D9B25C;background:rgba(217,178,92,.10)"><h2>Πληρωμές</h2><div class="big">${paid}</div>`;
  if (paid) {
    html += `<p class="muted" style="margin:10px 0 4px">Για ποια πρόβλεψη</p>${table(PT, k => PAGE["/" + k] || k)}`;
    if (Object.keys(PQ).length) html += `<p class="muted" style="margin:10px 0 4px">Ποια ερώτηση πλήρωσαν</p><table>${["q1", "q2", "q3"].map(q => `<tr><td>${{ q1: "1η ερώτηση (4,99€)", q2: "2η ερώτηση", q3: "3η ερώτηση" }[q]}</td><td class="n">${PQ[q] || 0}</td></tr>`).join("")}</table>`;
    html += `<p class="muted" style="margin:10px 0 4px">Με τι πλήρωσαν</p>${table(PM, k => MET[k] || k)}`;
    html += nr(PR).replace("Νέοι", "Με την πρώτη επίσκεψη").replace("Ξαναήρθαν", "Όταν ξαναήρθαν");
    if (r > 2) html += `<p class="muted" style="margin:10px 0 4px">Ανά μέρα</p><table>${d.days.slice(0, r).map(x => { let n = 0; for (const k in (x.e || {})) if (k.split(":")[0] === "pliromeni") n += x.e[k]; return n ? `<tr><td>${x.day.split("-").reverse().join("/")}</td><td class="n">${n}</td></tr>` : ""; }).join("")}</table>`;
  }
  html += `</div>`;
  html += funnel(V, E);
  // Άνθρωποι: ένα άτομο μία φορά ανά επίσκεψη, με την πηγή της πρώτης σελίδας που άνοιξε (μετράει από 23/11 βράδυ)
  html += `<div class="card"><h2>Άνθρωποι</h2><div class="big">${HP}</div>${nr(HR)}<p class="muted" style="margin:6px 0 0">Κάθε άτομο μετράει μία φορά σε κάθε επίσκεψη, όσες σελίδες κι αν ανοίξει. Μετράει από 23/11 βράδυ.</p></div>`;
  const hRows = Object.entries(HS).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${SRC[k] || k}</td><td class="n">${v}</td></tr>`).join("");
  html += `<div class="card"><h2>Από πού ήρθαν οι άνθρωποι</h2>${hRows ? "<table>" + hRows + "</table>" : '<p class="muted">Τίποτα ακόμα.</p>'}</div>`;
  html += `<div class="card"><h2>Σελίδες που άνοιξαν</h2><div class="big">${total}</div>${nr(VR)}<p class="muted" style="margin:6px 0 0">Κάθε άνοιγμα ή ανανέωση σελίδας μετράει ξεχωριστά.</p></div>`;
  const hasSR = Object.keys(SR).length;
  const srcRows = Object.entries(S).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${SRC[k] || k}${hasSR ? `<div class="muted">νέοι ${SR[k + ":n"] || 0} · ξαναήρθαν ${SR[k + ":r"] || 0}</div>` : ""}</td><td class="n">${v}</td></tr>`).join("");
  html += `<div class="card"><h2>Σελίδες που άνοιξαν, ανά πηγή</h2>${srcRows ? "<table>" + srcRows + "</table>" : '<p class="muted">Τίποτα ακόμα.</p>'}</div>`;
  html += `<div class="card"><h2>Τι έκαναν</h2>${table(REST, evName)}</div>`;
  html += `<div class="card"><h2>Σελίδες</h2>${table(V, k => PAGE[k] || k)}</div>`;
  if (r > 2) html += `<div class="card"><h2>Ανά μέρα</h2><table>${d.days.slice(0, r).map(x => `<tr><td>${x.day.split("-").reverse().join("/")}</td><td class="n">${x.h ? x.h + " άνθρωποι · " : ""}${Object.values(x.s || {}).reduce((a, b) => a + b, 0)} σελίδες</td></tr>`).join("")}</table></div>`;
  $("out").innerHTML = html;
}
async function loadRev() {
  const k = $("k").value.trim();
  const r = await fetch("/api/reviews?k=" + encodeURIComponent(k)); if (!r.ok) { $("rev").innerHTML = ""; return; }
  const d = await r.json();
  const esc = (t) => String(t || "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  let h = '<div class="card"><h2>Κριτικές από πελάτισσες (' + d.items.length + ')</h2>';
  if (!d.items.length) h += '<p class="muted">Καμία ακόμα.</p>';
  d.items.forEach(it => {
    const st = !it.publish ? "Δεν επέτρεψε δημοσίευση" : it.hidden ? "Κρυμμένη" : "Φαίνεται στη σελίδα";
    h += '<div style="border-top:1px solid rgba(255,255,255,.08);padding:10px 0">' +
      '<b>' + esc(it.name) + '</b> · ' + "★★★★★".slice(0, it.rating) + ' · <span class="muted">' + esc(it.tool) + ' · ' + esc((it.date || "").slice(0, 10)) + '</span>' +
      '<div style="margin:4px 0">' + esc(it.text) + '</div><span class="muted">' + st + '</span>' +
      (it.publish ? ' <button data-id="' + esc(it.id) + '" data-h="' + (it.hidden ? 0 : 1) + '" style="padding:6px 12px;font-size:14px;margin-left:8px">' + (it.hidden ? "Εμφάνισε" : "Κρύψε") + '</button>' : '') + '</div>';
  });
  $("rev").innerHTML = h + '<p class="muted">Κρύβε μόνο προσβλητικές, διαφημίσεις, άσχετες ή με προσωπικά στοιχεία. Η βαθμολογία με τα αστέρια μετράει όλες τις κριτικές, και τις κρυμμένες.</p></div>';
  $("rev").querySelectorAll("button[data-id]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    await fetch("/api/reviews", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ k, id: b.dataset.id, hidden: b.dataset.h === "1" }) });
    loadRev();
  });
}
$("go").onclick = () => { load(); loadRev(); };
if ($("k").value) { load(); loadRev(); }
</script>
</body>
</html>
