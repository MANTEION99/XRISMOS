<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Κωδικοί συνομιλίας | Διαχείριση</title>
<style>
  :root{ --paper:#F5F1E8; --muted:#9C96AE; --gold:#D9B25C; --gold-deep:#8C6420; --ruby:#B4576B; --line:rgba(217,178,92,0.35); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#0B0A16; color:var(--paper); font-family:system-ui, sans-serif; padding:20px 14px 60px; }
  .box{ max-width:560px; margin:0 auto; }
  h1{ color:var(--gold); font-size:22px; margin:0 0 16px; }
  .card{ border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; background:rgba(255,255,255,0.02); }
  label{ display:block; font-size:13px; color:var(--gold); margin-bottom:6px; }
  input{ width:100%; padding:12px; border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,0.04); color:var(--paper); font-size:16px; margin-bottom:10px; }
  button{ padding:12px 18px; border:none; border-radius:9px; background:linear-gradient(135deg, var(--gold), var(--gold-deep)); color:#241A08; font-weight:600; font-size:15px; cursor:pointer; }
  button.ghost{ background:transparent; border:1px solid var(--line); color:var(--paper); font-weight:400; padding:8px 12px; font-size:13px; }
  .err{ color:var(--ruby); font-size:14px; margin:6px 0; }
  .msg{ white-space:pre-wrap; background:rgba(217,178,92,0.08); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14.5px; line-height:1.55; margin:10px 0; }
  .row{ border-top:1px solid var(--line); padding:10px 0; display:flex; gap:10px; align-items:center; justify-content:space-between; font-size:14px; }
  .row b{ letter-spacing:2px; color:var(--gold); }
  .row small{ color:var(--muted); display:block; margin-top:2px; }
  .muted{ color:var(--muted); font-size:13px; line-height:1.5; }
</style>
</head>
<body>
<div class="box">
  <h1>Κωδικοί συνομιλίας με Το Μαντείο</h1>

  <div class="card">
    <label for="key">Κλειδί διαχείρισης</label>
    <input id="key" type="password" autocomplete="off">
    <div class="muted">Είναι η τιμή του CHAT_ADMIN_KEY στο Netlify. Μένει αποθηκευμένο μόνο σε αυτή τη συσκευή.</div>
  </div>

  <div class="card">
    <label for="name">Όνομα συνδρομήτριας (όπως στο Facebook)</label>
    <input id="name" type="text" placeholder="π.χ. Μαρία Βασιλάκη">
    <button id="create">Νέος κωδικός</button>
    <div class="err" id="err"></div>
    <div id="out" style="display:none">
      <div class="msg" id="msg"></div>
      <button class="ghost" id="copy">Αντιγραφή μηνύματος για το Messenger</button>
    </div>
  </div>

  <div class="card">
    <label for="cnt">Πολλοί κωδικοί μαζί, χωρίς όνομα</label>
    <input id="cnt" type="number" min="1" max="30" value="10">
    <button id="batch">Φτιάξε κωδικούς</button>
    <div class="err" id="err2"></div>
    <div id="out2" style="display:none">
      <div class="msg" id="msg2"></div>
      <button class="ghost" id="copy2">Αντιγραφή λίστας</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><label style="margin:0">Όλοι οι κωδικοί</label><button class="ghost" id="refresh">Ανανέωση</button></div>
    <div id="list" class="muted" style="margin-top:8px">Πάτησε «Ανανέωση».</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
try { $("key").value = localStorage.getItem("manteio-admin-key") || ""; } catch {}
$("key").addEventListener("change", () => { try { localStorage.setItem("manteio-admin-key", $("key").value); } catch {} });

async function api(body) {
  const r = await fetch("/api/synomilia-admin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("key").value, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Σφάλμα " + r.status);
  return d;
}
const fmt = (iso) => new Date(iso).toLocaleDateString("el-GR", { day: "numeric", month: "long" });

$("create").onclick = async () => {
  $("err").textContent = "";
  try {
    const rec = await api({ action: "create", name: $("name").value });
    const first = rec.name.split(" ")[0];
    $("msg").textContent = `Καλησπέρα ${first}! Ο προσωπικός σου κωδικός για τη συνομιλία του μήνα με Το Μαντείο είναι:\n\n${rec.code}\n\nΜπες εδώ και ξεκίνα: https://manteio.live/synomilia?k=${rec.code}\n\nΈχεις 5 ερωτήσεις πάνω στον δικό σου χάρτη. Ο κωδικός ισχύει έως ${fmt(rec.expiresAt)} και είναι μόνο για σένα.`;
    $("out").style.display = "block";
    $("name").value = "";
    load();
  } catch (e) { $("err").textContent = e.message; }
};
$("copy").onclick = async () => { try { await navigator.clipboard.writeText($("msg").textContent); $("copy").textContent = "Αντιγράφηκε!"; setTimeout(() => $("copy").textContent = "Αντιγραφή μηνύματος για το Messenger", 1500); } catch {} };

$("batch").onclick = async () => {
  $("err2").textContent = "";
  try {
    const { codes } = await api({ action: "batch", count: $("cnt").value });
    $("msg2").textContent = codes.map(c => c.code + "   https://manteio.live/synomilia?k=" + c.code).join("\n");
    $("out2").style.display = "block";
    load();
  } catch (e) { $("err2").textContent = e.message; }
};
$("copy2").onclick = async () => { try { await navigator.clipboard.writeText($("msg2").textContent); $("copy2").textContent = "Αντιγράφηκε!"; setTimeout(() => $("copy2").textContent = "Αντιγραφή λίστας", 1500); } catch {} };

async function load() {
  try {
    const { codes } = await api({ action: "list" });
    $("list").innerHTML = codes.length ? "" : "Δεν υπάρχουν ακόμα κωδικοί.";
    for (const c of codes) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<div><b></b> <span class="n"></span><small></small></div>`;
      row.querySelector("b").textContent = c.code;
      row.querySelector(".n").textContent = c.name;
      row.querySelector("small").textContent = `${c.status} · έως ${fmt(c.expiresAt)}${c.person ? " · " + c.person : ""}`;
      if (!c.revoked) {
        const x = document.createElement("button");
        x.className = "ghost"; x.textContent = "Ακύρωση";
        x.onclick = async () => { if (!confirm("Ακύρωση του κωδικού " + c.code + ";")) return; await api({ action: "revoke", code: c.code }); load(); };
        row.appendChild(x);
      }
      $("list").appendChild(row);
    }
  } catch (e) { $("list").textContent = e.message; }
}
$("refresh").onclick = load;
</script>
</body>
</html>
